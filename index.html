<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Controlled Website</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #000000;
      color: #39ff14; /* Neon Green */
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    h1 {
      font-size: 4rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 10px #39ff14, 0 0 20px #39ff14, 0 0 30px #39ff14;
      color: #39ff14;
    }

    p {
      font-size: 1.5rem;
      text-shadow: 0 0 5px #39ff14;
      color: #ffffff;
    }

    section {
      margin-top: 2rem;
      max-width: 600px;
    }

    h2 {
      color: #39ff14;
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      text-shadow: 0 0 10px #39ff14;
    }

    img {
      width: 100%;
      height: auto;
      border: 3px solid #39ff14;
      border-radius: 8px;
      box-shadow: 0 0 15px #39ff14;
    }

    .car-desc {
      font-size: 1.2rem;
      color: #ffffff;
      margin-top: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>I love n8n</h1>
  <p>
    This website is controlled by an AI agent.<br />
    Tell it what to change, and it will edit this HTML for you.
  </p>

  <section>
    <h2>Car Showcase</h2>
    <img src="https://via.placeholder.com/600x300?text=Car" alt="Car Image">
    <p class="car-desc">A sleek, futuristic car that combines cutting‑edge design with high performance. Perfect for the tech enthusiast.</p>
  </section>
</body>
</html>

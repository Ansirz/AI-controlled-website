<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Showcase</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="interactiveBackground"></canvas>

    <div class="container">
        <h1>Welcome to Our Car Showcase</h1>

        <div class="car-section">
            <h2>Featured Car</h2>
            <p>Check out our latest featured car model.</p>
            <a href="#" class="btn">Learn More</a>
        </div>

        <div class="form-section">
            <h2>Contact Us</h2>
            <form id="contactForm" action="https://quasistar.app.n8n.cloud/webhook-test/8d3fdacf-8af6-4ab3-b0f7-4e01c5c6d6e9" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn">Submit</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const canvas = document.getElementById('interactiveBackground');
            const ctx = canvas.getContext('2d');

            // Set canvas to full window size
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            // Create particles
            const particles = [];
            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 3 + 1,
                    dx: Math.random() * 2 - 1,
                    dy: Math.random() * 2 - 1,
                    color: `rgba(0, 100, 255, ${Math.random() * 0.5 + 0.5})`
                });
            }

            // Animation function
            function animate() {
                requestAnimationFrame(animate);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                // Update and draw particles
                particles.forEach(particle => {
                    particle.x += particle.dx;
                    particle.y += particle.dy;

                    // Bounce off edges
                    if (particle.x < 0 || particle.x > canvas.width) particle.dx = -particle.dx;
                    if (particle.y < 0 || particle.y > canvas.height) particle.dy = -particle.dy;

                    // Draw particle
                    ctx.beginPath();
                    ctx.arc(particle.x, particle.y, particle.radius, 0, Math.PI * 2);
                    ctx.fillStyle = particle.color;
                    ctx.fill();
                    ctx.closePath();
                });
            }

            // Start animation
            animate();

            // Handle window resize
            window.addEventListener('resize', function() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        });
    </script>
</body>
</html>

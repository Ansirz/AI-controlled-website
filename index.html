<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Showcase</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="interactiveBackground"></canvas>

    <div class="container">
        <h1>Welcome to Our Car Showcase</h1>

        <div class="car-section">
            <h2>Featured Car</h2>
            <p>Check out our latest featured car model.</p>
            <a href="#" class="btn">Learn More</a>
        </div>

        <div class="form-section">
            <h2>Contact Us</h2>
            <form id="contactForm" action="https://quasistar.app.n8n.cloud/webhook-test/8d3fdacf-8af6-4ab3-b0f7-4e01c5c6d6e9" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn">Submit</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
